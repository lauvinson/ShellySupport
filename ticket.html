<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>提交工单</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#498d8b",
                        "background-light": "#f8f7f7",
                        "background-dark": "#1c1f21",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                },
            },
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#131616] dark:text-gray-100 antialiased">
    <div class="relative flex flex-col min-h-screen w-full max-w-md mx-auto">
        <header class="flex items-center justify-between px-6 pt-14 pb-6">
            <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/50 dark:bg-black/20 backdrop-blur-sm text-gray-800 dark:text-white hover:bg-white/80 dark:hover:bg-black/30 transition-colors">
                <span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span>
            </a>
            <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">提交工单</h1>
            <div class="w-10"></div>
        </header>
        <main class="flex-1 flex flex-col px-6 pb-28 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-3 ml-1">问题类别</label>
                <div class="relative">
                    <select class="w-full h-16 pl-5 pr-12 bg-white dark:bg-[#2c3033] border-none rounded-xl text-base font-medium shadow-soft focus:ring-2 focus:ring-primary/50 appearance-none cursor-pointer">
                        <option disabled selected value="">请选择问题类别</option>
                        <option value="hardware">硬件故障</option>
                        <option value="connectivity">App 连接问题</option>
                        <option value="account">账号与计费</option>
                        <option value="other">其他问题</option>
                    </select>
                    <div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                        <span class="material-symbols-outlined">expand_more</span>
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-3 ml-1">详细描述</label>
                <textarea class="w-full min-h-[180px] p-5 bg-white dark:bg-[#2c3033] border-none rounded-xl text-base font-normal shadow-soft focus:ring-2 focus:ring-primary/50 resize-none leading-relaxed" placeholder="请详细描述您遇到的问题..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-3 ml-1">上传图片</label>
                <div class="flex gap-4">
                    <button class="shrink-0 size-24 rounded-xl border-2 border-dashed border-gray-300 dark:border-gray-600 bg-white/50 dark:bg-white/5 flex flex-col items-center justify-center text-gray-400 hover:text-primary hover:border-primary hover:bg-primary/5 transition-all group">
                        <span class="material-symbols-outlined text-3xl">add_photo_alternate</span>
                    </button>
                </div>
            </div>
            <div class="mt-auto pt-4">
                <button class="w-full h-14 bg-primary text-white font-bold text-lg rounded-full shadow-lg shadow-primary/30 hover:shadow-primary/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <span>提交</span>
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
                </button>
                <div class="text-center mt-4">
                    <a class="text-xs font-medium text-gray-400 hover:text-primary transition-colors flex items-center justify-center gap-1" href="chat.html">
                        <span class="material-symbols-outlined text-sm">support_agent</span>
                        需要帮助？联系在线客服
                    </a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
