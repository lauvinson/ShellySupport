<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>服务记录详情</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4594D1",
                        "background-light": "#f8f7f7",
                        "background-dark": "#1c1f21",
                        "status-blue": "#4D89DE",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <header class="flex items-center justify-between px-6 pt-14 pb-6 bg-background-light dark:bg-background-dark sticky top-0 z-10">
        <a href="history.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/50 dark:bg-black/20 backdrop-blur-sm text-gray-800 dark:text-white hover:bg-white/80 dark:hover:bg-black/30 transition-colors">
            <span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span>
        </a>
        <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">服务记录详情</h1>
        <div class="w-10"></div>
    </header>
    <main class="flex-1 px-6 pb-10">
        <div class="bg-white dark:bg-[#2c3033] rounded-2xl p-6 shadow-sm">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">无法连接到 Wi-Fi</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">#T-29381</p>
                </div>
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold bg-blue-50 dark:bg-blue-900/20 text-status-blue">处理中</span>
            </div>
            <div class="prose prose-sm dark:prose-invert max-w-none">
                <p>我的 Shelly 1PM 设备在更换了新的路由器后无法连接到 Wi-Fi 网络。我已尝试重启设备和路由器，但问题依旧。</p>
            </div>
        </div>

        <div class="mt-8">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-4">处理进度</h3>
            <div class="space-y-6 border-l-2 border-slate-200 dark:border-slate-700 ml-3">
                <div class="relative pl-8">
                    <div class="absolute -left-[7px] top-1 w-3 h-3 rounded-full bg-primary"></div>
                    <p class="font-semibold text-slate-800 dark:text-slate-100">已分配技术支持</p>
                    <p class="text-sm text-slate-500 dark:text-slate-400">我们的团队正在跟进处理。</p>
                    <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">2023年10月24日 10:30</p>
                </div>
                <div class="relative pl-8">
                    <div class="absolute -left-[7px] top-1 w-3 h-3 rounded-full bg-slate-300 dark:bg-slate-600"></div>
                    <p class="font-semibold text-slate-800 dark:text-slate-100">工单已创建</p>
                    <p class="text-sm text-slate-500 dark:text-slate-400">我们已收到您的问题。</p>
                    <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">2023年10月24日 10:25</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
