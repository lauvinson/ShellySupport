<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Shelly Support 首页</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4594D1",
                        "background-light": "#f8f7f7",
                        "background-dark": "#1c1f21",
                        "card-blue": "#EBF1F5",
                        "card-sand": "#F5F0EB",
                        "card-sage": "#EFF5F4",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .dark .glass-nav {
            background: rgba(28, 31, 33, 0.85);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#131616] dark:text-gray-100 font-display selection:bg-primary/30 antialiased">
    <div class="relative min-h-screen w-full flex flex-col overflow-x-hidden pb-24">
        <div class="h-12 w-full"></div>
        <header class="px-6 pt-4 pb-6 flex flex-col gap-3">
            <div class="flex items-center gap-2">
                <p class="text-gray-500 dark:text-gray-400 text-xs font-bold tracking-widest uppercase opacity-80">欢迎您</p>
                <div class="h-[1px] flex-1 bg-gray-200 dark:bg-gray-700"></div>
            </div>
            <h1 class="text-[#131616] dark:text-white text-[34px] font-serif font-medium leading-[1.3] tracking-tight">
                您好，<br />有什么可以帮您？
            </h1>
        </header>
        <main class="flex-1 px-6 flex flex-col gap-5">
            <a href="chat.html" class="group w-full text-left transition-all duration-300 hover:-translate-y-1 active:scale-[0.98]">
                <div class="relative flex items-center justify-between p-6 h-36 rounded-xl bg-[#E8EFF5] dark:bg-[#242c33] shadow-[0_4px_20px_-8px_rgba(59,130,246,0.15)] overflow-hidden border border-white/40 dark:border-white/5">
                    <div class="absolute -right-10 -top-10 w-48 h-48 rounded-full bg-gradient-to-br from-blue-100 to-transparent dark:from-blue-900/20 opacity-60 blur-2xl group-hover:opacity-80 transition-opacity"></div>
                    <div class="relative flex flex-col justify-center gap-1 z-10 h-full">
                        <span class="text-[#131616] dark:text-white text-xl font-bold font-serif tracking-tight">在线客服</span>
                        <span class="text-gray-500 dark:text-gray-400 text-sm font-medium">即时在线沟通</span>
                        <div class="mt-auto pt-2 flex items-center gap-2 text-xs font-bold text-blue-600 dark:text-blue-300 opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 duration-300">
                            开始咨询 <span class="material-symbols-outlined text-sm">arrow_forward</span>
                        </div>
                    </div>
                    <div class="relative flex items-center justify-center w-14 h-14 rounded-2xl bg-white dark:bg-white/10 shadow-sm z-10 group-hover:scale-110 transition-transform duration-300">
                        <span class="material-symbols-outlined text-[#5C84A3] dark:text-blue-200" style="font-size: 28px;">headset_mic</span>
                    </div>
                </div>
            </a>
            <a href="ticket.html" class="group w-full text-left transition-all duration-300 hover:-translate-y-1 active:scale-[0.98]">
                <div class="relative flex items-center justify-between p-6 h-36 rounded-xl bg-[#F5F0EB] dark:bg-[#332f2a] shadow-[0_4px_20px_-8px_rgba(180,83,9,0.1)] overflow-hidden border border-white/40 dark:border-white/5">
                    <div class="absolute -right-10 -bottom-10 w-48 h-48 rounded-full bg-gradient-to-tl from-orange-100 to-transparent dark:from-orange-900/20 opacity-60 blur-2xl group-hover:opacity-80 transition-opacity"></div>
                    <div class="relative flex flex-col justify-center gap-1 z-10 h-full">
                        <span class="text-[#131616] dark:text-white text-xl font-bold font-serif tracking-tight">提交工单</span>
                        <span class="text-gray-500 dark:text-gray-400 text-sm font-medium">提交问题或故障</span>
                        <div class="mt-auto pt-2 flex items-center gap-2 text-xs font-bold text-orange-700 dark:text-orange-300 opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 duration-300">
                            创建工单 <span class="material-symbols-outlined text-sm">arrow_forward</span>
                        </div>
                    </div>
                    <div class="relative flex items-center justify-center w-14 h-14 rounded-2xl bg-white dark:bg-white/10 shadow-sm z-10 group-hover:scale-110 transition-transform duration-300">
                        <span class="material-symbols-outlined text-[#A38A6D] dark:text-orange-200" style="font-size: 28px;">edit_document</span>
                    </div>
                </div>
            </a>
            <a href="feedback.html" class="group w-full text-left transition-all duration-300 hover:-translate-y-1 active:scale-[0.98]">
                <div class="relative flex items-center justify-between p-6 h-36 rounded-xl bg-[#EFF5F4] dark:bg-[#1f302f] shadow-[0_4px_20px_-8px_rgba(73,141,139,0.12)] overflow-hidden border border-white/40 dark:border-white/5">
                    <div class="absolute left-10 top-1/2 -translate-y-1/2 w-full h-24 bg-gradient-to-r from-transparent via-teal-100/30 to-transparent dark:via-teal-900/10 blur-xl rotate-12 group-hover:opacity-80 transition-opacity"></div>
                    <div class="relative flex flex-col justify-center gap-1 z-10 h-full">
                        <span class="text-[#131616] dark:text-white text-xl font-bold font-serif tracking-tight">建议反馈</span>
                        <span class="text-gray-500 dark:text-gray-400 text-sm font-medium">分享您的宝贵意见</span>
                        <div class="mt-auto pt-2 flex items-center gap-2 text-xs font-bold text-primary dark:text-teal-300 opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 duration-300">
                            发送反馈 <span class="material-symbols-outlined text-sm">arrow_forward</span>
                        </div>
                    </div>
                    <div class="relative flex items-center justify-center w-14 h-14 rounded-2xl bg-white dark:bg-white/10 shadow-sm z-10 group-hover:scale-110 transition-transform duration-300">
                        <span class="material-symbols-outlined text-primary dark:text-teal-200" style="font-size: 28px;">chat_bubble</span>
                    </div>
                </div>
            </a>
            <div class="h-8"></div>
        </main>
        <nav class="fixed bottom-0 left-0 w-full glass-nav border-t border-gray-100 dark:border-gray-800 pb-safe pt-1 px-6 z-50 rounded-t-2xl shadow-[0_-5px_20px_rgba(0,0,0,0.02)]">
            <div class="flex justify-between items-center h-[72px] max-w-sm mx-auto">
                <a href="index.html" class="flex flex-col items-center justify-center gap-1.5 w-16 h-full text-primary relative group">
                    <div class="absolute -top-[1px] w-8 h-[3px] bg-primary rounded-b-full"></div>
                    <span class="material-symbols-outlined font-variation-settings-fill" style="font-variation-settings: 'FILL' 1;">home</span>
                    <span class="text-[10px] font-bold tracking-wide">首页</span>
                </a>
                <a href="history.html" class="flex flex-col items-center justify-center gap-1.5 w-16 h-full text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 transition-colors group">
                    <span class="material-symbols-outlined group-hover:-translate-y-0.5 transition-transform duration-200">history</span>
                    <span class="text-[10px] font-medium tracking-wide">记录</span>
                </a>
                <a href="profile.html" class="flex flex-col items-center justify-center gap-1.5 w-16 h-full text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 transition-colors group">
                    <span class="material-symbols-outlined group-hover:-translate-y-0.5 transition-transform duration-200">person</span>
                    <span class="text-[10px] font-medium tracking-wide">我的</span>
                </a>
            </div>
            <div class="h-4 w-full"></div>
        </nav>
    </div>
</body>
</html>
